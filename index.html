<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart search — search first, assistant when you need it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00827d; --teal-dark:#006a66; --teal-tint:#e3f3f2; --nav:#383a45; --lilac:#f1ecf8; --link:#1b8a4b;
  --ink:#2f3138; --ink-2:#555a64; --muted:#7b808a; --line:#dfe2e7; --card:#ffffff; --chip:#ffffff;
  --cta:#198451; --cta-dark:#136a3f; --send-off:#a8d0b8; --user-bubble:#f9f9f9; --user-ink:#2f3138;
  --bot-icon:#5b3f8f; --hover:#F5F7FA; --soft:#F5F7FA; --soft-line:#EAEEF4; --soft-icon:#31445B;
  --tag-bg:#E3F2FD; --tag-ink:#0C5580; --tip-bg:#31445B; --tip-ink:#ffffff; --search-line:#6aa7a3;
  --grad-top:#e8ecf3; --grad-mid:#eff2f7; --grad-soft:#f8f9fb; --grad-end:#ffffff;
  --proto:#fff8e1; --proto-ink:#6b5200;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#e8e9ec; --ink-2:#c3c6cc; --muted:#9aa0a9; --line:#3a3e47; --card:#262930; --chip:#2d3038; --lilac:#322d3d;
  --teal-tint:#173634; --link:#5cc98a; --user-bubble:#3a3e47; --user-ink:#e8e9ec; --bot-icon:#c7b1ee;
  --hover:#2f333b; --soft:#2d3038; --soft-line:#3a3e47; --soft-icon:#b9c6d6; --tag-bg:#1c3448; --tag-ink:#9fd0f5;
  --tip-bg:#e8e9ec; --tip-ink:#1d1f24; --grad-top:#23262d; --grad-mid:#1f2127; --grad-soft:#1b1d22; --grad-end:#191a1f;
  --proto:#3a3218; --proto-ink:#f1d98a; }}
:root[data-theme="dark"]{
  --ink:#e8e9ec; --ink-2:#c3c6cc; --muted:#9aa0a9; --line:#3a3e47; --card:#262930; --chip:#2d3038; --lilac:#322d3d;
  --teal-tint:#173634; --link:#5cc98a; --user-bubble:#3a3e47; --user-ink:#e8e9ec; --bot-icon:#c7b1ee;
  --hover:#2f333b; --soft:#2d3038; --soft-line:#3a3e47; --soft-icon:#b9c6d6; --tag-bg:#1c3448; --tag-ink:#9fd0f5;
  --tip-bg:#e8e9ec; --tip-ink:#1d1f24; --grad-top:#23262d; --grad-mid:#1f2127; --grad-soft:#1b1d22; --grad-end:#191a1f;
  --proto:#3a3218; --proto-ink:#f1d98a; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow-x:clip;font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--grad-end);font-size:16px;line-height:1.5}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* prototype rail */
.rail{background:var(--proto);color:var(--proto-ink);border-bottom:1px solid var(--line);padding:10px 16px}
.rail-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rail strong{font-size:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:3px 11px;font-size:13px}
.steps button[aria-current="step"]{background:var(--proto-ink);color:var(--proto);border-color:var(--proto-ink)}
.note{flex-basis:100%;font-size:13.5px;margin:0}

/* site chrome */
.top{background:#fff;border-bottom:1px solid #d6d8dd}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;color:#333}
.logo b{font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1}
.logo small{display:block;font-size:11px;color:#666;font-weight:600}
.top-links{display:flex;gap:26px;font-size:15px;color:#444}
.navbar{background:var(--nav);color:#fff}
.navbar-inner{max-width:1180px;margin:0 auto;display:flex;gap:30px;padding:14px 20px;font-size:17px;overflow-x:auto}
@media (max-width:760px){.top-links span:not(:last-child){display:none}.logo small{display:none}}

/* hero */
main{max-width:1180px;margin:0 auto;padding:0 20px 60px;text-align:center}
.hero{position:relative;z-index:2;isolation:isolate;padding:44px 0 8px}
.hero::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:calc(50% - 50vw);width:100vw;
  background:var(--grad-end)}
h1{font-size:clamp(26px,4vw,40px);font-weight:600;margin:0 0 8px;letter-spacing:-.3px}
.sub{font-size:clamp(16px,2vw,20px);color:var(--ink-2);margin:0 0 28px}

/* search */
.search{position:relative;z-index:60;max-width:820px;margin:0 auto;text-align:left}
.search-box{position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 20px;border:1px solid var(--search-line);border-radius:28px;background:var(--card);box-shadow:0 6px 18px rgba(20,30,50,.08);transition:border-color .2s,box-shadow .2s}
.search-box:focus-within,.search.open .search-box{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,130,125,.13),0 6px 18px rgba(20,30,50,.08)}
.lead{position:relative;width:24px;height:24px;flex:none}
.lead svg{position:absolute;inset:0;width:24px;height:24px;transition:opacity .2s,transform .25s cubic-bezier(.3,.7,.2,1)}
.lead .i-search{color:var(--ink-2)}
.lead .i-ai{color:var(--bot-icon);opacity:0;transform:scale(.6) rotate(-20deg)}
.search.ai-mode .lead .i-search{opacity:0;transform:scale(.6) rotate(20deg)}
.search.ai-mode .lead .i-ai{opacity:1;transform:none}
.search-box input{flex:1;min-width:0;border:0;background:transparent;font-size:18px;color:var(--ink);-webkit-appearance:none;appearance:none}
.search-box input::placeholder{color:var(--ink-2);opacity:1}
.search-box input:focus{outline:none}
.search-box input::-webkit-search-cancel-button{display:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:50%}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn[hidden]{display:none}
.icon-btn svg{width:18px;height:18px}

.panel{position:absolute;left:0;right:0;top:64px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 34px rgba(20,30,50,.12);overflow:hidden}
.panel[hidden]{display:none}
.panel.enter{animation:panelIn .18s cubic-bezier(.3,.7,.2,1) both}
@keyframes panelIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.group-label{font-size:13px;font-weight:600;color:var(--muted);padding:12px 18px 4px}
.res{display:flex;flex-direction:column;gap:2px;width:100%;border:0;background:transparent;text-align:left;color:var(--ink);padding:10px 18px}
.res.hl,.res:hover{background:var(--hover)}
.res-top{display:flex;align-items:center;gap:10px}
.res-name{font-size:16px;font-weight:600}
.res-name mark{background:none;color:var(--teal-dark);font-weight:700}
.res-desc{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-empty{padding:16px 18px 6px;font-size:15px;color:var(--ink-2)}
.divider{height:1px;background:var(--line);margin:6px 0}
.ai-row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;text-align:left;color:var(--ink);padding:12px 18px}
.ai-row.hl,.ai-row:hover{background:var(--lilac)}
.ai-row.prominent{background:var(--lilac)}
.ai-row .txt{flex:1;min-width:0}
.ai-row b{display:block;font-size:16px;font-weight:600}
.ai-row small{display:block;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-cta{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;background:var(--cta);color:#fff;font-size:14px;font-weight:600;white-space:nowrap;transition:background .15s}
.ai-cta svg{width:18px;height:18px;transition:transform .2s cubic-bezier(.3,.7,.2,1)}
.ai-row:hover .ai-cta,.ai-row.hl .ai-cta{background:var(--cta-dark)}
.ai-row:hover .ai-cta svg,.ai-row.hl .ai-cta svg{transform:translateX(3px)}
@media (max-width:560px){.ai-row small{display:none}.ai-cta{padding:0 12px}}
.kbd{flex:none;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--card)}
.avatar{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--lilac);color:var(--bot-icon)}
.ai-row .avatar{background:var(--card)}
.avatar svg{width:22px;height:22px}
.foot-hint{display:flex;gap:16px;justify-content:flex-end;padding:8px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--soft)}

.doc-tag{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--tag-bg);color:var(--tag-ink);font-size:12px;font-weight:600;line-height:1}
.fc-head .doc-tag{height:26px;padding:0 10px;font-size:13px}
.doc-tag.tag-new{background:#EAEEF4;color:#31445B}

/* assistant inside the dropdown */
.ai-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 6px 18px;background:var(--lilac);min-height:48px}
.ai-top h2{margin:0;font-size:16px;font-weight:600;text-align:left}
.ai-top .left{display:flex}.ai-top .right{display:flex;justify-content:flex-end}
.text-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink);font-size:14px;font-weight:500;padding:7px 10px;border-radius:8px}
.text-btn:hover{background:rgba(91,63,143,.08)}
.text-btn svg{width:18px;height:18px}
.thread{display:flex;flex-direction:column;gap:14px;padding:16px 18px 6px;max-height:min(440px,58vh);overflow-y:auto;scrollbar-width:thin}
.turn{display:flex;flex-direction:column;gap:8px;flex:none}
.turn.user{align-items:flex-end}
.who{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px}
.who .avatar.user{background:var(--teal-tint);color:var(--teal-dark)}
.bubble{background:var(--user-bubble);color:var(--user-ink);border-radius:8px;padding:6px 10px;max-width:78%}
.turn.bot .body{padding-left:52px;display:flex;flex-direction:column;gap:10px}
.turn.bot .text{color:var(--ink-2)}
@media (max-width:560px){.turn.bot .body{padding-left:0}}
.form-card{width:min(440px,100%);border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.fc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px}
.form-card h3{margin:0;font-size:16px}
.form-card p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;white-space:nowrap;text-align:center}
.btn.primary{background:var(--cta);color:#fff}.btn.primary:hover{background:var(--cta-dark)}
.btn.ghost{background:transparent;color:var(--cta);border:1px solid var(--cta)}.btn.ghost:hover{background:rgba(25,132,81,.08)}
.also{font-size:14px;color:var(--ink-2)}
.also-row{display:flex;align-items:center;gap:10px;width:min(440px,100%);border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:transparent;text-align:left;color:var(--ink)}
.also-row:hover{background:var(--hover)}
.also-row .t{flex:1;min-width:0}
.also-row b{display:block;font-size:15px;font-weight:600}
.also-row small{display:block;font-size:13px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px}
.chip:hover{border-color:var(--soft-icon);background:var(--hover)}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--bot-icon);opacity:.35;animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:none}50%{opacity:.9;transform:translateY(-3px)}}
.fade-in{animation:fadeUp .28s cubic-bezier(.3,.7,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.compose{display:flex;align-items:center;margin:8px 18px 4px;border:1px solid var(--line);border-radius:10px;padding:5px 5px 5px 14px;background:var(--card)}
.compose:focus-within{border-color:var(--teal)}
.compose input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;color:var(--ink)}
.compose input::placeholder{color:var(--muted);opacity:1}
.compose input:focus{outline:none}
.send{width:44px;height:40px;border:0;border-radius:8px;background:var(--send-off);color:#fff;display:flex;align-items:center;justify-content:center}
.send.ready{background:var(--cta)}
.compose-foot{display:flex;justify-content:space-between;padding:0 18px 12px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.panel.enter,.fade-in,.dots i{animation:none}.lead svg{transition:none}}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* popular + A–Z */
.popular{position:relative;z-index:1;margin:26px 0 0;font-size:18px;line-height:1.6}
.popular b{margin-right:6px;font-weight:600}
.popular a{color:var(--link);text-decoration:none;margin:0 4px;font-size:18px;font-weight:600}
.popular a:hover{text-decoration:underline}
.az{position:relative;z-index:1;max-width:962px;margin:24px auto 0;text-align:left}
.az-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;margin:0 0 36px;padding:0;list-style:none}
.az-nav a,.az-nav span{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:40px;border-radius:6px;font-size:20px;font-weight:600;text-decoration:none}
.az-nav a{color:var(--link)}.az-nav a:hover{background:var(--hover)}
.az-nav span{color:var(--muted);opacity:.55}
.az-cols{columns:2;column-gap:64px}
@media (max-width:640px){.az-cols{columns:1}}
.az-group{break-inside:avoid;margin:0 0 40px;scroll-margin-top:24px}
.az-group h3{margin:0 0 14px;font-size:20px;font-weight:600}
.az-group ul{list-style:none;margin:0;padding:0 0 0 24px}
.az-group li{margin:0 0 14px;line-height:1.35;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.az-group a{color:var(--link);text-decoration:none;font-size:16px;font-weight:600}
.az-group a:hover{text-decoration:underline}
.doc-tip{position:absolute;z-index:70;max-width:300px;padding:10px 12px;border-radius:8px;background:var(--tip-bg);color:var(--tip-ink);font-size:14px;line-height:1.45;box-shadow:0 8px 24px rgba(20,30,50,.18);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .14s ease,transform .14s ease}
.doc-tip.show{opacity:1;transform:none}
.doc-tip b{display:block;font-weight:600;margin-bottom:2px}
.doc-tip::after{content:"";position:absolute;left:var(--arrow-x,20px);width:10px;height:10px;background:var(--tip-bg);transform:translateX(-50%) rotate(45deg)}
.doc-tip[data-place="top"]::after{bottom:-5px}
.doc-tip[data-place="bottom"]::after{top:-5px}
@media (prefers-reduced-motion:reduce){.doc-tip{transition:opacity .1s;transform:none!important}}

/* ---- Classic LawDepot suggestion list (results only) ---- */
.panel.classic{top:58px;border-radius:4px;border:1px solid #d6d9d9;box-shadow:0 4px 14px rgba(20,30,50,.10)}
.sugg{display:block;width:100%;height:48px;padding:0 14px;border:0;border-bottom:1px solid #e3e5e5;background:var(--card);color:var(--ink);text-align:left;font-size:17px;line-height:48px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg mark{background:#e6e6e6;color:inherit;padding:0}
.sugg.hl,.sugg:hover{background:#89adab;color:#fff}
.sugg.hl mark,.sugg:hover mark{background:transparent;color:inherit}
.classic-empty{padding:13px 14px;font-size:16px;color:var(--ink-2);border-bottom:1px solid #e3e5e5}
.ai-classic{display:flex;align-items:center;gap:16px;width:100%;padding:16px 24px;border:0;background:var(--card);color:var(--ink);text-align:left}
.ai-classic.hl,.ai-classic:hover{background:#F7F4FC}
.ai-classic .avatar{width:40px;height:40px;background:#5b3f8f;color:#fff}
.ai-classic .avatar svg{width:22px;height:22px}
.ai-classic .txt{flex:1;min-width:0}
.ai-classic b{display:block;font-size:16px;font-weight:600}
.ai-classic small{display:block;font-size:14px;color:var(--ink-2)}
.ai-classic .cta{flex:none;display:inline-flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:4px;background:#198451;color:#fff;font-size:17px;text-transform:uppercase;letter-spacing:.2px;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:background .15s}
.ai-classic .cta svg{width:22px;height:22px;transition:transform .2s cubic-bezier(.3,.7,.2,1)}
.ai-classic.hl .cta,.ai-classic:hover .cta{background:#136a3f}
.ai-classic.hl .cta svg,.ai-classic:hover .cta svg{transform:translateX(3px)}
@media (max-width:560px){.ai-classic{padding:12px 14px;gap:12px}.ai-classic small{display:none}.ai-classic .cta{font-size:14px;height:40px;padding:0 12px;gap:6px}}

/* Supplied LawDepot header artwork: white top band, dark nav band, both run full width */
.site-header{background:linear-gradient(180deg,#ffffff 0,#ffffff 75px,#393C47 75px,#393C47 140px);line-height:0}
.site-header-art{display:block;width:100%;max-width:1280px;height:auto;margin:0 auto}
@media (min-width:1281px){.site-header{background:linear-gradient(180deg,#ffffff 0,#ffffff 75px,#393C47 75px,#393C47 140px)}}
</style>
</head>
<body>

<header class="site-header">

p an activity, such as harassment or copyright infringement.", "Certificate of Incumbency": "Confirms who currently holds a company's officer and director positions.", "Certificate of Proof of Execution by a Subscribing Witness": "A witness's sworn statement confirming they saw a document being signed.", "Child Care Contract": "Sets hours, rates and rules between parents and a caregiver or daycare.", "Child Medical Consent": "Lets another adult approve medical treatment for your child while you're away.", "Child Travel Consent": "Gives permission for your child to travel without you, or with only one parent.", "Child Visitation Letter": "Sets out when and how a parent or relative can spend time with a child.", "Cleaning Services Agreement": "Sets the tasks, schedule and payment for cleaning services.", "Codicil": "Makes a small change to an existing will without writing a new one.", "Cohabitation Agreement": "Sets out how an unmarried couple living together handles property and money.", "Commercial Eviction Notice": "Tells a business tenant to pay, fix a violation, or leave the premises.", "Marketing Contract": "Sets the services, deliverables and fees for marketing work.", "Marriage Affidavit": "A sworn statement confirming that two people are married.", "Mechanic's Lien": "Secures payment for contractors or suppliers by placing a claim on the property they worked on.", "Medical Power of Attorney": "Names someone to make healthcare decisions for you if you can't.", "Medical Records Release": "Authorizes a provider to share your medical records with someone else.", "Memorandum of Understanding": "Records what the parties intend to do before a formal contract is signed.", "Minute Book Rights of Inspection": "Requests access to review a company's official records.", "Minutes of Directors' Meeting": "Records what was discussed and decided at a board meeting.", "Minutes of Shareholders' Meeting": "Records the discussions and votes at a shareholders' meeting.", "Model and Entertainment Release": "Gives permission to use a person's image, likeness or performance.", "Mortgage Agreement": "Secures a loan with real estate and sets the repayment terms.", "Music Performance Contract": "Sets the fee, date and terms for a live musical performance.", "Music Recording Contract": "Sets terms between an artist and a producer or label for recording music.", "New Hire Checklist": "Tracks the forms and steps needed to onboard a new employee.", "Non-Compete Agreement": "Stops an employee or partner from competing with your business for a set time.", "Non-Disclosure Agreement": "Keeps confidential information shared between parties private.", "Notice of Intent to Vacate Premises": "Tells your landlord you plan to move out, and when.", "Notice of Lease Violation": "Tells a tenant they've broken a lease term and what they need to fix.", "Notice of Termination": "Formally ends a contract, lease or employment in writing.", "Notice of Withdrawal from Partnership": "Informs your partners that you're leaving the partnership.", "Notice To Enter": "Gives a tenant advance notice that the landlord will enter the property.", "Notice to Pay Rent or Quit": "Tells a tenant to pay overdue rent or move out by a deadline.", "Notice to Quit": "Tells a tenant to leave the property by a specific date.", "Notice to Repair": "Asks a landlord or tenant to fix a problem with the property.", "Offer to Lease": "Proposes the key terms for renting a property before a lease is signed.", "Offer to Purchase Real Estate": "Makes a formal offer to buy a property, including price and conditions.", "One Page Business Plan": "A short summary of your business goals, strategy and key numbers.", "Online Divorce Papers": "Helps you prepare the documents needed to file for an uncontested divorce.", "Online Notary": "Lets you get documents notarized remotely over video.", "Pagaré": "Spanish-language promissory note recording a promise to repay a loan.", "Partnership Agreement": "Sets out how partners share ownership, profits, losses and decisions.", "Partnership Amendment": "Changes the terms of an existing partnership agreement.", "Payment Agreement Template": "Sets a schedule for paying off a debt in installments.", "Performance Contract": "Sets the terms for an entertainer's or speaker's appearance at an event.", "Personal Care Profile": "Records a person's care needs, routines and preferences for caregivers.", "Personal Property Rental Agreement": "Sets terms for renting out equipment, vehicles or other belongings.", "Personal/Corporate Guarantee": "Makes a person or company responsible for another party's debt if they don't pay.", "Pet Agreement": "Adds pet rules to a lease, such as deposits and owner responsibilities.", "Postnuptial Agreement": "Sets out how a married couple would divide property and money if they separate.", "Pour-Over Will": "Moves any assets left outside your living trust into it when you die.", "Power of Attorney": "Gives someone you trust the authority to act for you on financial or legal matters.", "Power of Attorney for Child": "Lets another adult make decisions for your child for a set period.", "Prenuptial Agreement": "Sets out how a couple would divide property and money, signed before they marry.", "Production Contract": "Sets the terms for producing a film, show, event or other creative project.", "Progressive Discipline Policy": "Outlines the steps an employer takes to address performance or conduct issues.", "Promissory Note": "A written promise to repay a loan, with the amount, interest and schedule.", "Proof of Income/Employment Letter": "Confirms someone's job and income, often for a landlord or lender."};

const I_USER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.3 18.3c1.4-1.7 3.4-2.8 5.7-2.8s4.3 1.1 5.7 2.8"/></svg>';
const I_BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
const I_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const I_SEND='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ---------- search ---------- */
const STOP=new Set(["i","im","i'm","a","an","the","my","to","for","of","and","me","is","am","want","need","with","on","in","it","we","our","do","how","what","some","someone"]);
function looksLikeSentence(q){ const w=q.trim().split(/\s+/); return w.length>=4 || /^(i|i'm|im|my|we|how|what|can|should|help)\b/i.test(q.trim()); }
function startsWord(w,text){ return new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(text); }
function wordIn(w,text){ return new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b").test(text); }
function searchDocs(q){
  const t=q.toLowerCase().trim(); if(!t) return [];
  const words=t.split(/\s+/).map(w=>w.replace(/[^a-z0-9'&-]/g,"")).filter(w=>w.length>1&&!STOP.has(w));
  const scored=[];
  for(const n of DOCS){
    const nl=n.toLowerCase(), dl=(AZ_DESC[n]||"").toLowerCase();
    let sc=0;
    if(nl.startsWith(t)) sc=100; else if(startsWord(t,nl)) sc=85;
    else if(words.length && words.every(w=>startsWord(w,nl))) sc=60;
    else if(nl.includes(t)) sc=40;
    else if(words.length && words.every(w=>nl.includes(w))) sc=35;
    else if(words.length && words.every(w=>nl.includes(w)||wordIn(w,dl))) sc=30;
    if(sc){ if(TAGS[n]==="Popular") sc+=5; scored.push([sc,n]); }
  }
  return scored.sort((a,b)=>b[0]-a[0]||a[1].localeCompare(b[1])).slice(0,6).map(x=>x[1]);
}
function highlight(name,q){
  const words=q.toLowerCase().split(/\s+/).filter(w=>w.length>1&&!STOP.has(w)).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  let out=esc(name); if(!words.length) return out;
  return out.replace(new RegExp("\\b("+words.join("|")+")","ig"),"<mark>$1</mark>");
}

/* ---------- the assistant (scripted for the prototype) ---------- */
const TOPICS=[
 {k:"roommate",re:/roommate|moving in with|share (my|a|the) (place|apartment|house)|moving into my/,doc:"Roommate Agreement",say:"Since you're sharing a place, a Roommate Agreement sets out rent, bills and house rules between you.",alt:["Residential Lease Agreement","If you're the landlord renting to them."],chips:["I own the place","We're both on the lease","They're paying me rent"]},
 {k:"evict",re:/evict|late on rent|behind on rent|won'?t pay|not paying rent|kick (them|him|her) out/,doc:"Notice to Pay Rent or Quit",say:"When rent is overdue, start with a Notice to Pay Rent or Quit. It gives the tenant a deadline to pay or move out.",alt:["Notice of Lease Violation","If the problem is something other than rent."],chips:["It's a business tenant","They broke another rule","They just need to leave"]},
 {k:"loan",re:/\blend|loan|borrow|\bowe\b|install?ments?|pay (me|you|it) back|over time|payment plan/,doc:"Promissory Note",say:"For money paid back over time, a Promissory Note sets the amount, interest and repayment schedule.",alt:["Payment Agreement Template","If you're settling an existing debt in installments."],chips:["It's between family","I want to charge interest","It's a large business loan"]},
 {k:"medical",re:/medical|hospital|health ?care|doctor|life support/,doc:"Medical Power of Attorney",say:"To choose who makes healthcare decisions if you can't, use a Medical Power of Attorney.",alt:["Living Will","To write down the treatment you do or don't want."],chips:["I also have kids","It's for my parent","I want my records shared"]},
 {k:"travel",re:/travel|\btrip\b|flying|vacation|abroad/,doc:"Child Travel Consent",say:"If your child is travelling without you, a Child Travel Consent shows you've given permission.",alt:["Child Medical Consent","So the adult with them can approve treatment if needed."],chips:["Only one parent is going","They're going with grandparents","It's a school trip"]},
 {k:"marriage",re:/marry|married|wedding|prenup|engaged|fianc/,doc:"Prenuptial Agreement",say:"Before marriage, a Prenuptial Agreement sets out how you'd divide property and money if you separate.",alt:["Cohabitation Agreement","If you're living together but not marrying yet."],chips:["We're already married","We're just moving in","We own a house"]},
 {k:"nda",re:/confidential|secret|\bidea|\bnda\b|disclos|investor|pitch/,doc:"Non-Disclosure Agreement",say:"To keep what you share private, use a Non-Disclosure Agreement before you share it.",alt:["Non-Compete Agreement","If you also want to stop them competing with you."],chips:["It's with an employee","It's with an investor","Both sides share info"]},
 {k:"hire",re:/hire|hiring|contractor|freelanc|employee|staff|nanny|cleaner/,doc:"Independent Contractor Agreement",say:"For someone doing work for you on their own terms, an Independent Contractor Agreement sets the scope, pay and deadlines.",alt:["Employment Contract","If they'll be a regular employee on your payroll."],chips:["It's full-time","It's a one-off project","They'll see confidential info"]},
 {k:"business",re:/start(ing)? a business|llc|incorporat|new company|my own business/,doc:"Business Formation",say:"Starting out? Business Formation walks you through setting up an LLC or corporation.",alt:["Business Plan","If you need to pitch lenders or investors first."],chips:["I have a partner","I'm a sole owner","I need funding"]},
 {k:"partner",re:/partner/,doc:"Partnership Agreement",say:"A Partnership Agreement sets out who owns what, how profits are split and how decisions get made.",alt:["Non-Disclosure Agreement","If you're still sharing plans before committing."],chips:["A partner is leaving","We're a band","We're adding a partner"]},
 {k:"sale",re:/truck|\bcars?\b|vehicle|sell|selling|\bsold\b|\bbuy|buying|boat|bike|furniture|trailer/,doc:"Bill of Sale",say:"For a private sale, a Bill of Sale records the deal and proves the buyer now owns it.",alt:["Promissory Note","If the buyer will pay you over time."],chips:["It's a vehicle","They'll pay in installments","I'm the buyer"]},
 {k:"lease",re:/\brent|\blease|tenant|landlord|renting|basement|apartment|suite/,doc:"Residential Lease Agreement",say:"Renting out a home? A Residential Lease Agreement sets the rent, term and rules for your tenant.",alt:["Rental Application","To screen tenants before you sign."],chips:["I'm the tenant","It's a room in my house","It's a commercial space"]},
 {k:"will",re:/\bwill\b|kids|children|\bestate\b|pass away|\bdie\b|inherit|family|guardian/,doc:"Last Will and Testament",say:"To decide who gets your property and who looks after your kids, start with a Last Will and Testament.",alt:["Power of Attorney","So someone can manage your affairs while you're alive but unable to."],chips:["I have young kids","I also want healthcare wishes","I have a trust"]},
 {k:"poa",re:/decisions|on my behalf|behalf|sign for me|while i'?m away|elderly|aging parent/,doc:"Power of Attorney",say:"A Power of Attorney lets someone you trust handle financial or legal matters for you.",alt:["Medical Power of Attorney","For healthcare decisions instead."],chips:["It's for healthcare","It's for my child","Only for a short time"]},
];
const FOLLOW=[
 {when:"sale",re:/vehicle|car|truck/,say:"Good, the Bill of Sale covers vehicles. You'll add the make, model, VIN and odometer reading, and you both sign it."},
 {when:"sale",re:/install?ments?|over time|pay (me )?later|payment plan/,say:"Then you'll want two documents: the Bill of Sale transfers ownership, and a Promissory Note records the payment plan.",doc:"Promissory Note",alt:["Bill of Sale","Still needed to transfer ownership."],altLabel:"You'll also need"},
 {when:"sale",re:/buyer/,say:"Same form works for you. Both of you sign it, and you keep a copy as proof you own it now."},
 {when:"roommate",re:/own the place|paying me rent/,say:"Then you're their landlord, so a Residential Lease Agreement fits better.",doc:"Residential Lease Agreement",alt:["Roommate Agreement","If you'd rather keep things informal."]},
 {when:"will",re:/young kids|children/,say:"Your will is where you name a guardian for them. That's covered in the Last Will and Testament."},
];
function topicFor(text){ const t=text.toLowerCase(); return TOPICS.find(x=>x.re.test(t))||null; }

/* ---------- state ---------- */
const S={mode:"closed",q:"",hl:-1,items:[],turns:[],ctx:null,thinking:false};
const panel=$("panel"), q=$("q"), searchEl=$("search");

function setOpen(open){
  if(open && panel.hidden){ panel.hidden=false; panel.classList.remove("enter"); void panel.offsetWidth; panel.classList.add("enter"); }
  if(!open){ panel.hidden=true; S.mode="closed"; searchEl.classList.remove("ai-mode"); }
  searchEl.classList.toggle("open",open); q.setAttribute("aria-expanded",open);
}
/* Smoothly animate the dropdown between its old and new height */
function morphHeight(update){
  if(panel.hidden||reduceMotion()){ update(); return; }
  const h0=panel.offsetHeight; update(); const h1=panel.offsetHeight;
  if(Math.abs(h1-h0)>2) panel.animate([{height:h0+"px"},{height:h1+"px"}],{duration:240,easing:"cubic-bezier(.3,.7,.2,1)"});
}

/* Other names people search for, shown as "Alias (Document)" like the live site */
const ALIASES={"Bill of Sale":["Receipt","Sales Slip","Sales Receipt","Proof of Sale"],
 "Last Will and Testament":["Will","Testament"],"Non-Disclosure Agreement":["NDA","Confidentiality Agreement"],
 "Residential Lease Agreement":["Rental Agreement","Tenancy Agreement"],"Promissory Note":["IOU","Loan Note"],
 "Power of Attorney":["POA"],"Affidavit":["Sworn Statement"]};
function suggestions(v){
  const t=v.toLowerCase(), out=[], seen=new Set();
  const add=(label,doc)=>{ if(!seen.has(label)&&out.length<7){ seen.add(label); out.push({label,doc}); } };
  for(const [doc,al] of Object.entries(ALIASES)) for(const a of al) if(a.toLowerCase().startsWith(t)) add(`${a} (${doc})`,doc);
  for(const doc of searchDocs(v)){ add(doc,doc); (ALIASES[doc]||[]).forEach(a=>add(`${a} (${doc})`,doc)); }
  return out;
}
function markTyped(label,v){
  const i=label.toLowerCase().indexOf(v.toLowerCase());
  if(v.length<1) return esc(label);
  const re=new RegExp("("+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  return i>=0 ? esc(label).replace(re,"<mark>$1</mark>") : highlight(label,v);
}
function renderResults(){
  const v=q.value.trim(); S.q=v; $("clear").hidden=!v;
  if(!v){ setOpen(false); return; }
  const list=suggestions(v), sentence=looksLikeSentence(v);
  S.items=[]; let html="";
  if(!list.length) html+=`<div class="classic-empty">No documents match “${esc(v)}”.</div>`;
  list.forEach(x=>{ S.items.push({type:"doc",name:x.doc}); const i=S.items.length-1;
    html+=`<button type="button" class="sugg" data-i="${i}" id="opt${i}" role="option">${markTyped(x.label,v)}</button>`; });
  S.items.push({type:"ai"}); const ai=S.items.length-1;
  html+=`<button type="button" class="ai-classic" data-i="${ai}" id="opt${ai}" role="option"><span class="avatar">${I_BOT}</span><span class="txt"><b>${list.length?"Not what you’re looking for?":"Can’t find it?"}</b><small>${list.length?"Describe your situation in plain words instead":"The assistant can work out what you need"}</small></span><span class="cta">Search assistant<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>`;
  S.hl = (!list.length||sentence) ? ai : 0;
  const wasAI=S.mode==="ai";
  S.mode="results"; searchEl.classList.remove("ai-mode");
  const apply=()=>{panel.classList.add("classic"); panel.innerHTML=`<div role="listbox" aria-label="Suggestions">${html}</div>`; paintHL();};
  if(wasAI) morphHeight(apply); else { setOpen(true); apply(); }
  setOpen(true);
}
function paintHL(){
  panel.querySelectorAll("[data-i]").forEach(el=>el.classList.toggle("hl",+el.dataset.i===S.hl));
  q.setAttribute("aria-activedescendant",S.hl>=0?"opt"+S.hl:"");
  const el=panel.querySelector(`[data-i="${S.hl}"]`); if(el) el.scrollIntoView({block:"nearest"});
}
function pick(i){
  const it=S.items[i]; if(!it) return;
  if(it.type==="ai") askAI(S.q); else openDoc(it.name);
}
function openDoc(name){
  setOpen(false); q.value=name; $("clear").hidden=false;
  toast(`Opening ${name}…`);
}
function toast(msg){ const h=$("toastHost"); h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML="",2200); }

/* ---------- assistant view inside the dropdown ---------- */
function askAI(text,fresh=true){
  if(!text.trim()) return;
  if(fresh){ S.turns=[]; S.ctx=null; }
  S.turns.push({r:"user",t:text});
  S.thinking=true;
  const first=S.mode!=="ai";
  S.mode="ai"; searchEl.classList.add("ai-mode"); setOpen(true);
  panel.classList.remove("classic");
  morphHeight(()=>renderAI(first));
  clearTimeout(askAI.t);
  askAI.t=setTimeout(()=>{ S.thinking=false; S.turns.push(reply(text)); morphHeight(()=>renderAI(false,true)); const f=$("fu"); if(f) f.focus({preventScroll:true}); }, reduceMotion()?150:850);
}
function reply(text){
  const t=text.toLowerCase();
  if(/not quite/.test(t)) return {r:"bot",t:"No problem. What's different about your situation? Who's involved, and what should the document do?",chips:["Buying or selling something","Renting a place","Planning ahead for my family"]};
  const f=S.ctx && FOLLOW.find(x=>x.when===S.ctx.k && x.re.test(t));
  if(f){ return {r:"bot",t:f.say,doc:f.doc||S.ctx.doc,alt:f.alt||null,altLabel:f.altLabel,chips:[]}; }
  const tp=topicFor(t);
  if(tp){ S.ctx=tp; return {r:"bot",t:tp.say,doc:tp.doc,alt:tp.alt,chips:tp.chips}; }
  return {r:"bot",t:"I want to get this right. Who's involved, and what are you hoping the document does?",chips:["Buying or selling something","Renting a place","Planning ahead for my family"]};
}
function turnHTML(m,isNew){
  const cls=isNew?" fade-in":"";
  if(m.r==="user") return `<div class="turn user${cls}"><div class="who"><span class="avatar user">${I_USER}</span>You</div><div class="bubble">${esc(m.t)}</div></div>`;
  let b=`<div class="text">${esc(m.t)}</div>`;
  if(m.doc) b+=`<div class="form-card"><div class="fc-head"><h3>${esc(m.doc)}</h3>${tagHTML(m.doc)}</div><p>${esc(AZ_DESC[m.doc]||"")}</p><div class="actions"><button type="button" class="btn primary" data-open="${esc(m.doc)}">Create document</button><button type="button" class="btn ghost" data-say="That's not quite it">Not quite right</button></div></div>`;
  if(m.chips&&m.chips.length) b+=`<div class="chips">${m.chips.map(c=>`<button type="button" class="chip" data-say="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  return `<div class="turn bot${cls}"><div class="who"><span class="avatar">${I_BOT}</span>Search Assistant</div><div class="body">${b}</div></div>`;
}
function renderAI(first,animateLast){
  const n=S.turns.length;
  let th=S.turns.map((m,i)=>turnHTML(m, first || (i>=n-1 && (animateLast||m.r==="user")))).join("");
  if(S.thinking) th+=`<div class="turn bot fade-in"><div class="who"><span class="avatar">${I_BOT}</span>Search Assistant</div><div class="body"><span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span></div></div>`;
  panel.innerHTML=`
    <div class="ai-top"><h2>Search Assistant</h2><div class="right"><button type="button" class="icon-btn" id="closeAI" aria-label="Close">${I_X}</button></div></div>
    <div class="thread" id="thread" aria-live="polite">${th}</div>
    <div class="compose"><input id="fu" maxlength="500" enterkeyhint="send" placeholder="Add details, e.g. “it's a vehicle”" aria-label="Add details for the assistant"><button type="button" class="send" id="fuSend" aria-label="Send">${I_SEND}</button></div>
    <div class="compose-foot"><span>Suggestions, not legal advice</span><span id="fuCount">0/500</span></div>`;
  const thread=$("thread"); thread.scrollTop=thread.scrollHeight;
  const fu=$("fu"), send=$("fuSend");
  fu.addEventListener("input",()=>{$("fuCount").textContent=fu.value.length+"/500"; send.classList.toggle("ready",!!fu.value.trim());});
  const go=()=>{const v=fu.value.trim(); if(v&&!S.thinking) askAI(v,false);};
  fu.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.isComposing){e.preventDefault();go();} if(e.key==="Escape"){closeAll();} });
  send.addEventListener("click",go);
  $("closeAI").onclick=closeAll;
}
function closeAll(){ setOpen(false); q.focus({preventScroll:true}); }

/* ---------- wiring ---------- */
q.addEventListener("input",()=>{ clearTimeout(askAI.t); S.thinking=false; renderResults(); });
q.addEventListener("focus",()=>{ if(q.value.trim() && panel.hidden) renderResults(); });
q.addEventListener("keydown",e=>{
  if(e.isComposing) return;
  const n=S.items.length;
  if(S.mode==="results"){
    if(e.key==="ArrowDown"&&n){e.preventDefault();S.hl=(S.hl+1)%n;paintHL();}
    else if(e.key==="ArrowUp"&&n){e.preventDefault();S.hl=(S.hl-1+n)%n;paintHL();}
    else if(e.key==="Tab"&&q.value.trim()&&!e.shiftKey){e.preventDefault();askAI(q.value.trim());}
    else if(e.key==="Enter"){e.preventDefault();
      if(S.hl>=0) pick(S.hl);
      else { const docs=S.items.filter(x=>x.type==="doc");
        if(!docs.length||looksLikeSentence(q.value)) askAI(q.value.trim()); else openDoc(docs[0].name); } }
    else if(e.key==="Escape"){setOpen(false);}
  } else if(S.mode==="ai"){
    if(e.key==="Enter"){e.preventDefault(); askAI(q.value.trim());}
    else if(e.key==="Escape"){setOpen(false);}
  } else if(e.key==="Enter"&&q.value.trim()){e.preventDefault();renderResults();}
});
$("clear").onclick=()=>{ q.value=""; renderResults(); q.focus(); };
panel.addEventListener("mousedown",e=>{ if(e.target.closest("button")&&!e.target.closest(".compose")) e.preventDefault(); });
panel.addEventListener("click",e=>{
  const o=e.target.closest("[data-i]"); if(o){ pick(+o.dataset.i); return; }
  const d=e.target.closest("[data-open]"); if(d){ openDoc(d.dataset.open); return; }
  const s=e.target.closest("[data-say]"); if(s&&!S.thinking){ askAI(s.dataset.say,false); }
});
panel.addEventListener("mousemove",e=>{ const o=e.target.closest("[data-i]"); if(o&&+o.dataset.i!==S.hl){S.hl=+o.dataset.i;paintHL();} });
document.addEventListener("mousedown",e=>{ if(!e.target.closest("#search")&&!panel.hidden) setOpen(false); });
document.querySelectorAll("[data-pick]").forEach(a=>a.onclick=e=>{e.preventDefault();openDoc(a.textContent);});

/* ---------- A–Z list + tooltips ---------- */
const AZ_LETTERS="ABCDEFGHIJLMNOPQRSTVW".split("");
$("azNav").innerHTML=AZ_LETTERS.map(l=>AZ[l]?`<li><a href="#az-${l}">${l}</a></li>`:`<li><span aria-disabled="true">${l}</span></li>`).join("");
$("azCols").innerHTML=Object.keys(AZ).map(l=>`<div class="az-group" id="az-${l}"><h3>${l}</h3><ul>${AZ[l].map(d=>`<li><a href="#" onclick="return false" data-doc="${esc(d)}">${esc(d)}</a>${tagHTML(d)}</li>`).join("")}</ul></div>`).join("");
(function(){
  const tip=document.createElement("div"); tip.className="doc-tip"; tip.id="docTip"; tip.setAttribute("role","tooltip"); tip.hidden=true; document.body.appendChild(tip);
  let timer=null,current=null,lastHide=0;
  function place(a){const r=a.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight,gap=10,vw=document.documentElement.clientWidth;
    const pl=r.top-th-gap>8?"top":"bottom"; const left=Math.min(Math.max(8,r.left),vw-tw-8);
    tip.dataset.place=pl; tip.style.left=(left+scrollX)+"px"; tip.style.top=((pl==="top"?r.top-th-gap:r.bottom+gap)+scrollY)+"px";
    tip.style.setProperty("--arrow-x",Math.min(Math.max(14,r.left+Math.min(r.width/2,40)-left),tw-14)+"px");}
  function show(a){const d=AZ_DESC[a.dataset.doc]; if(!d) return; current=a; tip.innerHTML="<b>"+esc(a.dataset.doc)+"</b>"+esc(d);
    tip.hidden=false; tip.classList.remove("show"); place(a); a.setAttribute("aria-describedby","docTip"); requestAnimationFrame(()=>tip.classList.add("show"));}
  function hide(){clearTimeout(timer); if(current){current.removeAttribute("aria-describedby");current=null;lastHide=performance.now();} tip.classList.remove("show"); tip.hidden=true;}
  const cols=$("azCols");
  cols.addEventListener("mouseover",e=>{const a=e.target.closest("a[data-doc]"); if(a&&a!==current){ if(current) hide(); clearTimeout(timer); timer=setTimeout(()=>show(a),performance.now()-lastHide<400?0:350);}});
  cols.addEventListener("mouseout",e=>{const a=e.target.closest("a[data-doc]"); if(a&&!a.contains(e.relatedTarget)) hide();});
  cols.addEventListener("focusin",e=>{const a=e.target.closest("a[data-doc]"); if(a){hide();show(a);}});
  cols.addEventListener("focusout",hide);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&current) hide();});
  addEventListener("scroll",()=>{if(current) place(current);},{passive:true});
})();

</script>
